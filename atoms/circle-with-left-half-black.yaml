# atoms/circle-with-left-half-black.yaml
# The middle state — partial, idle, transitioning, half-full. The pivot in the
# status triad ● ◐ ○.
glyph: ◐
name: CIRCLE WITH LEFT HALF BLACK
codepoint: U+25D0
unicode_block: Geometric Shapes
unicode_version: "1.1"

aliases:
  - half circle
  - half-filled dot
  - idle indicator
  - partial dot
  - transitioning dot
  - half-moon
  - the in-between

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: variable

tier: 0

semantic:
  primary: status:partial
  also:
    - status:idle
    - status:transitioning
    - severity:half
    - progress:half-cell
    - phase:loading
  not:
    - decoration
    - moon phase emoji affect

pairs_with:
  complement: ◑ (CIRCLE WITH RIGHT HALF BLACK)
  next_in_set:
    - ● (BLACK CIRCLE)
    - ○ (WHITE CIRCLE)
    - ◒ (CIRCLE WITH LOWER HALF BLACK)
    - ◓ (CIRCLE WITH UPPER HALF BLACK)
  family:
    - ◔ (CIRCLE WITH UPPER RIGHT QUADRANT BLACK)
    - ◕ (CIRCLE WITH ALL BUT UPPER LEFT QUADRANT BLACK)

visual_neighbors:
  - ◑ (CIRCLE WITH RIGHT HALF BLACK) — mirrored fill
  - ◒ (CIRCLE WITH LOWER HALF BLACK) — vertical split
  - ◓ (CIRCLE WITH UPPER HALF BLACK) — vertical split
  - 🌗 (LAST QUARTER MOON SYMBOL) — emoji moon
  - ☯ (YIN YANG) — symbolic, not status
  - ⏾ (LAST QUARTER MOON) — astronomical, different glyph

prefer_over:
  - "◑ in LTR contexts — the dark side reads as ‘past/done’ on the left"
  - "🌗 in monochrome status UIs — emoji breaks the surface"
  - "↻ when conveying ‘paused mid-state’ rather than ‘retry’"

prefer_under:
  - "◑ in RTL contexts where dark-on-right reads more naturally as ‘past/done’"
  - "↻ when conveying active retry rather than static partial state"

anti_uses:
  - "As moon-phase decoration — use moon-block emoji 🌑..🌘 instead"
  - "As yin-yang ornament — use ☯, ◐ carries status semantics"
  - "Mixed with ◑ in the same column — readers parse them as the same state"
  - "Three or more ◐ in a row — pick a clearer set, half-fill is hard to count"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: ◑ (CIRCLE WITH RIGHT HALF BLACK)
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - terminal-hacker
  - modern-minimal
  - rtl-arabic-elegant
  - status-operational

examples:
  - context: "Build pipeline, mid-state"
    snippet: "◐ building · 12s elapsed"
  - context: "Health board, one job transitioning"
    snippet: "● geolink-api   ◐ hvar-cron   ○ taxi-arab"
  - context: "Three-state ladder"
    snippet: "● ● ◐ ○"
  - context: "Loading sequence frame"
    snippet: "◐ syncing 42% · ETA 18s"

cross_references:
  pairs:
    - "pairs.md#half-state-circles"
  sets:
    - "sets.md#severity-dots"
    - "sets.md#circle-fill-progression"
  widgets:
    - "widgets.md#status-line"
    - "widgets.md#health-card"

added_in: 0.1.0
last_verified: 2026-05-19
