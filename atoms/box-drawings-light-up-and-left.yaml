# atoms/box-drawings-light-up-and-left.yaml
glyph: ┘
name: BOX DRAWINGS LIGHT UP AND LEFT
codepoint: U+2518
unicode_block: Box Drawing
unicode_version: "1.1"

aliases:
  - bottom-right corner
  - corner up-left
  - box SE
  - frame end-bottom-right

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: 2ch
tier: 1

semantic:
  primary: corner:bottom-right
  also:
    - frame:end-bottom
  not:
    - bracket

pairs_with:
  complement: ┌ (BOX DRAWINGS LIGHT DOWN AND RIGHT)
  next_in_set:
    - └ (BOX DRAWINGS LIGHT UP AND RIGHT)
    - ┐ (BOX DRAWINGS LIGHT DOWN AND LEFT)
  family:
    - "┌ ┐ └ ┘ ┏ ┓ ┗ ┛"

visual_neighbors:
  - "┛ (BOX DRAWINGS HEAVY UP AND LEFT) — W3"
  - "╝ (BOX DRAWINGS DOUBLE UP AND LEFT) — doubled"
  - "╯ (BOX DRAWINGS LIGHT ARC UP AND LEFT) — rounded"
  - "⌟ (BOTTOM RIGHT CORNER) — punctuation-class"

prefer_over:
  - "┛ when matching W1/W2 weights"
  - "╝ for non-decorative boxes"
  - "+ ASCII"

prefer_under:
  - "╯ in maximalist-decorative for rounded warmth"
  - "┛ for emphasis"

anti_uses:
  - "Mixed weights inside one box"
  - "As bracket in prose"
  - "In proportional fonts"
  - "Standalone without ─ continuation"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: true
  arabic_equivalent: └ (BOX DRAWINGS LIGHT UP AND RIGHT)
  safe_in_rtl: false

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - terminal-hacker
  - scientific-technical
  - status-operational

examples:
  - context: "Card bottom-right"
    snippet: "┌──────────┐\n│  ● live  │\n└──────────┘"
  - context: "Mini card"
    snippet: "┌────┐\n│ 47 │\n└────┘"
  - context: "Right-aligned callout end"
    snippet: "        ┌─ note ┐\n        │  v0.1 │\n        └───────┘"
  - context: "Two boxes inline"
    snippet: "┌── api ──┐ ┌── db ──┐\n│  ● up   │ │  ◐ idle │\n└─────────┘ └─────────┘"

cross_references:
  pairs:
    - "pairs.md#box-corners"
  sets:
    - "sets.md#box-drawing-light"
  widgets:
    - "widgets.md#card-frame"

added_in: 0.1.0
last_verified: 2026-05-19
