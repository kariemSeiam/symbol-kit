# atoms/circled-minus.yaml
# The error / stopped / unavailable indicator. Complements severity dots.
glyph: ⊘
name: CIRCLED DIVISION SLASH
codepoint: U+2298
unicode_block: Mathematical Operators
unicode_version: "1.1"

aliases:
  - error dot
  - stopped indicator
  - crossed circle
  - unavailable
  - blocked

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W2
width_class: variable

tier: 1

semantic:
  primary: status:error
  also:
    - status:stopped
    - status:unavailable
    - severity:critical
  not:
    - decoration
    - math:division (use ÷ or / instead)

pairs_with:
  complement: null
  next_in_set:
    - ● (BLACK CIRCLE)   # live
    - ◐ (CIRCLE WITH LEFT HALF BLACK)  # idle
    - ○ (WHITE CIRCLE)    # offline
  family:
    - ● ◐ ○ ⊘

visual_neighbors:
  - ⊗ (CIRCLED TIMES) — heavier, different semantics (math multiply)
  - ⦸ (CIRCLED DIVISION SIGN) — math variant
  - 🚫 (NO ENTRY SIGN) — emoji

prefer_over:
  - "⊗ for status indicator — ⊘ is the standard SRE error glyph"
  - "🚫 in monochrome terminal UIs"

prefer_under:
  - "⨂ in math contexts where ⊘ is division"

anti_uses:
  - "As a math division operator — use ÷ or /"
  - "Next to ✓ — confuses: ✓ means 'correct', ⊘ means 'broken'"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - status-operational

examples:
  - context: "Service down in health board"
    snippet: "⊘ geolink-api   unreachable"
  - context: "Build failed indicator"
    snippet: "⊘ build  ·  12 errors"
  - context: "Status legend"
    snippet: "● live  ·  ◐ idle  ·  ○ offline  ·  ⊘ error"

cross_references:
  pairs: []
  sets:
    - "sets.md#severity-dots"
  widgets:
    - "widgets.md#status-footer"

added_in: 0.1.0
last_verified: 2026-05-19
