# atoms/ballot-x.yaml
# Universal failure/cancel/no mark. Complement of CHECK MARK (✓).
# Text-form default — the emoji ❌ is a different glyph, not a VS variant.
glyph: ✗
name: BALLOT X
codepoint: U+2717
unicode_block: Dingbats
unicode_version: "1.1"

aliases:
  - x
  - fail
  - failure
  - cancel
  - "no"
  - rejected
  - denied
  - failed

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W2
width_class: variable

tier: 0

semantic:
  primary: state:failure
  also:
    - state:rejected
    - state:cancelled
    - test:failed
    - input:invalid
    - task:aborted
  not:
    - decoration
    - multiplication
    - signature-x

pairs_with:
  complement: ✓ (CHECK MARK)
  next_in_set:
    - ✘ (HEAVY BALLOT X)
    - ☒ (BALLOT BOX WITH X)
  family:
    - ✘ (HEAVY BALLOT X)
    - ✕ (MULTIPLICATION X)
    - ☒ (BALLOT BOX WITH X)
    - ❌ (CROSS MARK — emoji, different codepoint)

visual_neighbors:
  - ✘ (HEAVY BALLOT X) — W3, bolder
  - ✕ (MULTIPLICATION X) — math semantics
  - × (MULTIPLICATION SIGN) — math, lighter
  - ❌ (CROSS MARK) — emoji surface
  - ☒ (BALLOT BOX WITH X) — wrapped
  - 🗙 (LIGHT SALTIRE) — W0 variant

prefer_over:
  - "✘ when matching W1/W2 weights — ✘ is heavier"
  - "❌ in monochrome UIs and code contexts — emoji breaks surface"
  - "× (MULTIPLICATION SIGN) for failure — × reads as math"
  - "[FAIL] in modern-minimal vibes — ✗ is denser, no brackets"

prefer_under:
  - "✘ in standalone error states where bolder stroke aids recognition"
  - "❌ in chat/social surfaces where colour reinforces meaning"

anti_uses:
  - "As multiplication sign — use × (U+00D7) or ⋅"
  - "As ‘close’ button glyph — use × or 🗙, ✗ implies failure"
  - "As decorative cross — use ✚ or ✠ for true cross shapes"
  - "Inside <code> next to ❌ — text/emoji surface collision"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - terminal-hacker
  - modern-minimal
  - maximalist-decorative
  - rtl-arabic-elegant
  - game-ui
  - status-operational
  - diff-patch

examples:
  - context: "CI step report with failure"
    snippet: "✓ lint   ✓ types   ✗ tests"
  - context: "Form validation"
    snippet: "✓ email · ✗ password too short"
  - context: "Health board with one down service"
    snippet: "● api   ✗ db   ● cache"
  - context: "Diff review rejection"
    snippet: "✗ rejected · see comments"

cross_references:
  pairs:
    - "pairs.md#check-x-pair"
  sets:
    - "sets.md#binary-state-marks"
  widgets:
    - "widgets.md#ci-status"
    - "widgets.md#form-validation"

added_in: 0.1.0
last_verified: 2026-05-19
