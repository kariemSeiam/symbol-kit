# atoms/bullet.yaml
glyph: •
name: BULLET
codepoint: U+2022
unicode_block: General Punctuation
unicode_version: "1.1"

aliases:
  - bullet point
  - list bullet
  - filled bullet
  - the prose dot
  - body dot

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W2
width_class: narrow
tier: 1

semantic:
  primary: list:bullet
  also:
    - mark:item
    - prose:emphasis-dot
    - separator:prose-heavy
  not:
    - status indicator (use ●)
    - decimal point
    - multiplication

pairs_with:
  complement: ◦ (WHITE BULLET)
  next_in_set:
    - ◦ (WHITE BULLET)
    - ▪ (BLACK SMALL SQUARE)
    - ‣ (TRIANGULAR BULLET)
  family:
    - "• ◦ ▪ ▫ ‣ ⁃"

visual_neighbors:
  - "● (BLACK CIRCLE) — status, bigger"
  - "· (MIDDLE DOT) — separator, smaller"
  - "∙ (BULLET OPERATOR) — math, similar"
  - "⋅ (DOT OPERATOR) — math, baseline"

prefer_over:
  - "● when used as a list bullet — • means bullet, ● means status"
  - "· when starting a list item — · is for inline separators"
  - "- when wanting heavier visual weight than ASCII"

prefer_under:
  - "● when used as a status indicator"
  - "· for inline metadata separators"
  - "‣ for emphasized bullets in literature/notes"

anti_uses:
  - "As status indicator — use ● instead"
  - "As multiplication — use × or ⋅"
  - "Inline as metadata separator — use ·"
  - "Mixed with ● in the same column — readers conflate"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - modern-minimal
  - maximalist-decorative
  - rtl-arabic-elegant
  - scientific-technical

examples:
  - context: "Plain bullet list"
    snippet: "• fetch\n• parse\n• render"
  - context: "Nested with white bullet"
    snippet: "• services\n  ◦ api\n  ◦ db"
  - context: "Inline emphasis"
    snippet: "ship • test • iterate"
  - context: "Two-column prose with bullets"
    snippet: "• fast    • secure\n• small   • portable"

cross_references:
  pairs:
    - "pairs.md#filled-empty-bullets"
  sets:
    - "sets.md#bullet-family"
  widgets:
    - "widgets.md#bulleted-list"

added_in: 0.1.0
last_verified: 2026-05-19
