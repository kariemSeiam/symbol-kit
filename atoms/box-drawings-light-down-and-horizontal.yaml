# atoms/box-drawings-light-down-and-horizontal.yaml
# The top T-junction. Used for table headers in terminal frames.
glyph: ┬
name: BOX DRAWINGS LIGHT DOWN AND HORIZONTAL
codepoint: U+252C
unicode_block: Box Drawing
unicode_version: "1.1"

aliases:
  - top T-junction
  - header divider
  - table head
  - down-tee

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: narrow

tier: 1

semantic:
  primary: frame:joint-down
  also:
    - structure:table-header
    - border:top-splitter
  not:
    - decoration

pairs_with:
  complement: ┴ (BOX DRAWINGS LIGHT UP AND HORIZONTAL)
  next_in_set:
    - ─ (BOX DRAWINGS LIGHT HORIZONTAL)
    - │ (BOX DRAWINGS LIGHT VERTICAL)
  family:
    - ┌ ┐ └ ┘ ├ ┤ ┬ ┴ ┼ ─ │

visual_neighbors:
  - ┤ (right T-junction)
  - ├ (left T-junction)
  - ┼ (cross junction)
  - T (ASCII capital T) — similar shape, wrong weight

prefer_over:
  - "ASCII T when the rest of the frame is box-drawing"

prefer_under:
  - "Nothing — this is the only top T-junction at W1 weight"

anti_uses:
  - "Outside monospace font — junction will not align"
  - "In proportionally-spaced Telegram body text"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: false

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - terminal-hacker

examples:
  - context: "Table header in terminal frame"
    snippet: "┌──────┬──────┐\n│ name │ val  │"
  - context: "HUD header split"
    snippet: "┌──[ STATUS ]──┬──[ METRICS ]──┐"

cross_references:
  pairs:
    - "pairs.md#box-corners"
  sets:
    - "sets.md#box-drawing-lines"
  widgets:
    - "widgets.md#health-board"

added_in: 0.1.0
last_verified: 2026-05-19
