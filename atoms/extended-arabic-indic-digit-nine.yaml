# atoms/eastern-arabic-indic-digit-nine.yaml
# Arabic numeral. RTL-Arabic-Elegant vibe.
glyph: ۹
name: EXTENDED ARABIC-INDIC DIGIT NINE
codepoint: U+06F9
unicode_block: Arabic Presentation Forms-A
unicode_version: "6.0"

aliases:
  - persian-nine
  - farsi-nine
  - "9"

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: variable

tier: 1

semantic:
  primary: numeral:9-persian
  also:
    - digit:nine, persian-numeral:nine
  not:
    - decoration-standalone
    - western-equivalent-substitute

pairs_with:
  complement: null
  next_in_set: []
  family:
    - "٠"
    - "١"
    - "٢"
    - "٣"
    - "٤"
    - "٥"
    - "٦"
    - "٧"
    - "٨"
    - "٩"

visual_neighbors:
  - Western digit equivalent

prefer_over:
  - "Western digit in Arabic-context UI"

prefer_under:
  - "Western digit in LTR-context UI"

anti_uses:
  - "In LTR-only UI where users expect Western digits"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - rtl-arabic-elegant

examples:
  - context: "Arabic-context UI"
    snippet: "۹"
  - context: "Arabic numeral in sequence"
    snippet: "۹۹۹"

cross_references:
  pairs: []
  sets: []
  widgets: []

added_in: 0.1.0
last_verified: 2026-05-19
