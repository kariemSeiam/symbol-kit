# atoms/clockwise-open-circle-arrow.yaml
# The retry / refresh indicator. Universal in SRE dashboards.
glyph: ↻
name: CLOCKWISE OPEN CIRCLE ARROW
codepoint: U+21BB
unicode_block: Arrows
unicode_version: "1.1"

aliases:
  - retry arrow
  - refresh
  - reload
  - redo
  - circular arrow

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: variable

tier: 1

semantic:
  primary: action:retry
  also:
    - status:retrying
    - flow:circular
    - ui:refresh-button
  not:
    - direction:forward
    - navigation

pairs_with:
  complement: null
  next_in_set:
    - ↺ (ANTICLOCKWISE OPEN CIRCLE ARROW)
  family:
    - ↻ ↺ 🔄

visual_neighbors:
  - ↺ (opposite direction) — counter-clockwise / undo
  - 🔄 (COUNTERCLOCKWISE ARROWS BUTTON) — emoji-form
  - ⟳ — heavier variant

prefer_over:
  - "🔄 in monochrome contexts — text-form survives terminal"

prefer_under:
  - "🔄 in color-friendly UI where the green/blue adds meaning"

anti_uses:
  - "As a direction indicator — use → instead"
  - "In RTL Arabic body adjacent to flowing text — the arrow is LTR"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - status-operational

examples:
  - context: "Retry notice in incident card"
    snippet: "↻ retry in 30s"
  - context: "Pipeline rerun button"
    snippet: "↻ rerun"
  - context: "Auto-refresh indicator"
    snippet: "↻ every 5s"

cross_references:
  pairs: []
  sets: []
  widgets:
    - "widgets.md#diff-header"

added_in: 0.1.0
last_verified: 2026-05-19
