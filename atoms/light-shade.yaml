# atoms/light-shade.yaml
glyph: ░
name: LIGHT SHADE
codepoint: U+2591
unicode_block: Block Elements
unicode_version: "1.1"

aliases:
  - light shade
  - 25% shade
  - light fill
  - dot-matrix light
  - background block

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W2
width_class: variable
tier: 1

semantic:
  primary: shade:light
  also:
    - intensity:25
    - texture:dot-matrix-light
    - background:filler
  not:
    - empty
    - decoration

pairs_with:
  complement: █ (FULL BLOCK)
  next_in_set:
    - ▒ (MEDIUM SHADE)
    - ▓ (DARK SHADE)
    - █ (FULL BLOCK)
  family:
    - "░ ▒ ▓ █"

visual_neighbors:
  - "▒ (MEDIUM SHADE) — denser"
  - "▓ (DARK SHADE) — densest before full block"
  - "▱ (WHITE PARALLELOGRAM) — outline, no texture"
  - "·  ·  · (repeated middle dots) — pattern, not block"

prefer_over:
  - "▒ when matching W1/W2 surrounding atoms"
  - "Repeated · in monospace — ░ tiles to a true block"
  - "Empty cells when texture is meaningful (terminal htop)"

prefer_under:
  - "▒ when slightly heavier shade is needed"
  - "▱ when discrete cells are needed, not background texture"

anti_uses:
  - "Mixed with ▰▱ pills — block vs pill weight clash"
  - "In small font sizes — texture disappears"
  - "Adjacent to ⠿ braille blocks — visual confusion"
  - "Above 4 W3 atoms — visual noise"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - terminal-hacker
  - status-operational

examples:
  - context: "Terminal progress (htop style)"
    snippet: "▓▓▓▓▒▒░░  CPU 60%"
  - context: "Heatmap row, low intensity"
    snippet: "░░░░░  jan"
  - context: "Background filler in box"
    snippet: "┌──────────┐\n│░░░░░░░░░░│\n└──────────┘"
  - context: "Trough in sparkline-like display"
    snippet: "▓▓▓░░▓▓"

cross_references:
  pairs:
    - "pairs.md#shade-ramp"
  sets:
    - "sets.md#shade-blocks"
  widgets:
    - "widgets.md#terminal-progress"
    - "widgets.md#heatmap"

added_in: 0.1.0
last_verified: 2026-05-19
