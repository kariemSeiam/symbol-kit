# atoms/box-drawings-light-arc-up-and-right.yaml
# Bottom-left rounded corner. Used in maximalist-decorative frames.
glyph: ╰
name: BOX DRAWINGS LIGHT ARC UP AND RIGHT
codepoint: U+2570
unicode_block: Box Drawing
unicode_version: "1.1"

aliases:
  - rounded bottom-left
  - arc corner BL
  - smooth corner bottom-left

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W2
width_class: narrow

tier: 2

semantic:
  primary: frame:corner-rounded-bl
  also:
    - border:decorative-bottom-start
    - structure:soft-frame
  not:
    - structure:grid-cell

pairs_with:
  complement: ╮ (BOX DRAWINGS LIGHT ARC DOWN AND LEFT)
  next_in_set:
    - ╭ ╮ ╰ ╯
  family:
    - ╭ ╮ ╰ ╯

visual_neighbors:
  - └ (sharp bottom-left corner) — W1
  - ⌊ (LEFT FLOOR) — math bracket

prefer_over:
  - "└ in decorative UIs"

prefer_under:
  - "└ in terminal-hacker vibe"

anti_uses:
  - "Mixed with sharp corners in same frame"
  - "Outside monospace font"
  - "In terminal-hacker vibe"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: false

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - maximalist-decorative

examples:
  - context: "Decorative rounded frame"
    snippet: "╰──────────╯"

examples:
