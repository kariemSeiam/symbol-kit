# atoms/midline-horizontal-ellipsis.yaml
# The mid-line ellipsis — vertically centred, unlike the baseline … (HORIZONTAL
# ELLIPSIS U+2026). Use this when overflow/continuation is part of UI state,
# not trailing speech. Composes cleanly with status dots (● ◐ ○) by aligning
# at midline.
glyph: ⋯
name: MIDLINE HORIZONTAL ELLIPSIS
codepoint: U+22EF
unicode_block: Mathematical Operators
unicode_version: "3.2"

aliases:
  - midline ellipsis
  - overflow dots
  - more dots
  - continuation dots
  - in-progress dots
  - the three-dot pause

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: variable

tier: 0

semantic:
  primary: state:overflow
  also:
    - state:in-progress
    - state:more
    - mark:continuation
    - mark:truncation
  not:
    - "trailing speech ellipsis (use …)"
    - decoration
    - "‘and so on’ in body prose (use …)"

pairs_with:
  complement: null
  next_in_set:
    - … (HORIZONTAL ELLIPSIS — baseline)
    - ⋮ (VERTICAL ELLIPSIS)
    - ⋰ (UP RIGHT DIAGONAL ELLIPSIS)
    - ⋱ (DOWN RIGHT DIAGONAL ELLIPSIS)
  family:
    - ⋯ … ⋮ ⋰ ⋱ ⁝

visual_neighbors:
  - … (HORIZONTAL ELLIPSIS) — baseline-aligned, text prose
  - ⋮ (VERTICAL ELLIPSIS) — column overflow
  - ⁝ (TRICOLON) — punctuation
  - ⠶ (BRAILLE PATTERN DOTS-2356) — looks similar in some fonts
  - 𑇉  (BRAHMI PUNCTUATION QUADRUPLE DANDA) — exotic match

prefer_over:
  - "… (HORIZONTAL ELLIPSIS) in UIs that mix with status dots — ⋯ aligns at midline"
  - "... (three full stops) — ⋯ is one glyph, scales cleanly, copy-paste safe"
  - "→… combinations — use ⋯ alone for in-progress"
  - "🔄 in monochrome contexts — emoji breaks surface, ⋯ stays calm"

prefer_under:
  - "… in body prose and quotations — … is the typographic standard"
  - "⋮ for vertical/column overflow — ⋯ is horizontal"
  - "↻ when the in-progress state actively retries vs idly waits"

anti_uses:
  - "In Arabic body prose — use … (or none), ⋯ is technical UI context"
  - "Adjacent to … in same line — visual confusion, pick one"
  - "Inside CI step status — use ◐ for ‘in progress’, ⋯ for ‘pending step not started’"
  - "As bullet — use • or · instead"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - terminal-hacker
  - modern-minimal
  - maximalist-decorative
  - rtl-arabic-elegant
  - scientific-technical
  - game-ui
  - status-operational
  - diff-patch

examples:
  - context: "CI run with pending steps"
    snippet: "✓ lint   ✓ types   ◐ tests   ⋯ deploy"
  - context: "Truncated list"
    snippet: "rust · async · networking · ⋯"
  - context: "Loading state in footer"
    snippet: "◐ syncing ⋯ · ETA 18s"
  - context: "Tree node with hidden children"
    snippet: "├ services\n│  ├ api\n│  └ ⋯ (3 more)"

cross_references:
  pairs:
    - "pairs.md#ellipsis-pair"
  sets:
    - "sets.md#ellipsis-directions"
  widgets:
    - "widgets.md#tree-view"
    - "widgets.md#truncated-list"

added_in: 0.1.0
last_verified: 2026-05-19
