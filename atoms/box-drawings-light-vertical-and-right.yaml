# atoms/box-drawings-light-vertical-and-right.yaml
# T-junction with horizontal branch going right. The tree-branch glyph.
glyph: ├
name: BOX DRAWINGS LIGHT VERTICAL AND RIGHT
codepoint: U+251C
unicode_block: Box Drawing
unicode_version: "1.1"

aliases:
  - tree branch
  - tree mid-branch
  - left T
  - vertical-right tee
  - branch
  - the fork

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: 2ch
tier: 1

semantic:
  primary: tree:branch
  also:
    - junction:vertical-right
    - frame:left-tee
  not:
    - vertical bar
    - cross

pairs_with:
  complement: ┤ (BOX DRAWINGS LIGHT VERTICAL AND LEFT)
  next_in_set:
    - └ (BOX DRAWINGS LIGHT UP AND RIGHT)
    - │ (BOX DRAWINGS LIGHT VERTICAL)
  family:
    - "├ ┤ ┬ ┴ ┼ ┣ ┫"

visual_neighbors:
  - "┣ (BOX DRAWINGS HEAVY VERTICAL AND RIGHT) — W3"
  - "╠ (BOX DRAWINGS DOUBLE VERTICAL AND RIGHT) — doubled"
  - "ŀ (LATIN SMALL LETTER L WITH MIDDLE DOT) — unrelated"
  - "├ vs E rotated 90° — visually similar in cramped fonts"

prefer_over:
  - "+ ASCII junction — robust under copy-paste"
  - "┣ when matching W1/W2 surrounding atoms"
  - "├ over ╠ for non-decorative trees"

prefer_under:
  - "┣ in headers or emphasis trees"

anti_uses:
  - "Last item in a tree — use └ instead (├ implies more siblings follow)"
  - "In proportional fonts"
  - "Mixed weight inside same tree"
  - "Adjacent to non-light horizontals at junction"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: true
  arabic_equivalent: ┤ (BOX DRAWINGS LIGHT VERTICAL AND LEFT)
  safe_in_rtl: false

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - terminal-hacker
  - scientific-technical
  - status-operational

examples:
  - context: "File tree"
    snippet: "├─ api\n├─ db\n└─ cache"
  - context: "Nested tree"
    snippet: "├─ services\n│  ├─ api\n│  └─ db\n└─ scripts"
  - context: "Status sub-list"
    snippet: "├─ ● geolink-api\n├─ ◐ hvar-cron\n└─ ○ taxi-arab"
  - context: "Side-rule with content"
    snippet: "├ status\n├ live\n└ 47ms"

cross_references:
  pairs:
    - "pairs.md#tee-junctions"
  sets:
    - "sets.md#box-drawing-light"
  widgets:
    - "widgets.md#tree-view"
    - "widgets.md#nested-list"

added_in: 0.1.0
last_verified: 2026-05-19
