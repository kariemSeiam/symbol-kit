# atoms/high-voltage-sign.yaml
# The alert / urgent indicator. Electric, attention-grabbing.
glyph: ⚡
name: HIGH VOLTAGE SIGN
codepoint: U+26A1
unicode_block: Miscellaneous Symbols
unicode_version: "4.0"

aliases:
  - lightning
  - alert flash
  - urgent
  - zap
  - electric

form:
  default: emoji
  variation_selectors:
    none: emoji
    VS15: text
  emoji_form_exists: true

weight_class: W3
width_class: emoji-wide

tier: 1

semantic:
  primary: alert:urgent
  also:
    - status:critical-alert
    - energy:high
    - marker:attention
  not:
    - decoration
    - weather (use ☈ instead)
    - status:normal

pairs_with:
  complement: null
  next_in_set:
    - ⚠ (WARNING SIGN)  # caution
  family:
    - ⚠ ⚡

visual_neighbors:
  - ⚠ (WARNING SIGN) — caution, not urgent
  - ⛈ (THUNDER CLOUD AND RAIN) — weather
  - 🔌 (ELECTRIC PLUG) — emoji

prefer_over:
  - "⚠ when the alert is urgent/active, not precautionary"

prefer_under:
  - "⚠ when the alert is advisory/precautionary"

anti_uses:
  - "Next to ⚠ in the same severity scale — pick one alert glyph system"
  - "In body prose as decoration — it reads as 'danger'"
  - "In RTL container — the bolt shape is directionless but verify render"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: true

copy_paste_safe: false
monochrome_guaranteed: false

vibes:
  - status-operational

examples:
  - context: "Critical alert in incident card"
    snippet: "⚡ CRITICAL  ·  service unreachable"
  - context: "High-priority notification"
    snippet: "⚡ 3 unread critical alerts"

cross_references:
  pairs: []
  sets: []
  widgets:
    - "widgets.md#health-board"

added_in: 0.1.0
last_verified: 2026-05-19
