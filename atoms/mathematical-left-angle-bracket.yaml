# atoms/mathematical-left-angle-bracket.yaml
# Left angle bracket for set notation, tuples, generics.
glyph: ⟨
name: MATHEMATICAL LEFT ANGLE BRACKET
codepoint: U+27E8
unicode_block: Miscellaneous Mathematical Symbols-A
unicode_version: "3.2"

aliases:
  - left angle bracket
  - left chevron
  - opening angle
  - bra

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: variable

tier: 2

semantic:
  primary: bracket:angle-open
  also:
    - math:inner-product
    - notation:set-delimiter
    - type:generic-open
  not:
    - comparison:less-than (use <)
    - decoration

pairs_with:
  complement: ⟩ (MATHEMATICAL RIGHT ANGLE BRACKET)
  next_in_set:
    - ⟩ ⌈ ⌉ ⌊ ⌋
  family:
    - ⟨ ⟩

visual_neighbors:
  - < (LESS-THAN SIGN) — ASCII, different semantics
  - ‹ (SINGLE LEFT-POINTING ANGLE QUOTATION MARK)
  - 〈 (LEFT-POINTING ANGLE BRACKET) — same glyph, alternate codepoint

prefer_over:
  - "< in mathematical notation — ⟨ is the correct semantic bracket"
  - "〈 for Unicode compliance with newer standards"

prefer_under:
  - "< in code where ASCII is required"

anti_uses:
  - "As a less-than comparison — use <"
  - "In body prose as decoration"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: true
  arabic_equivalent: null
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - scientific-technical

examples:
  - context: "Inner product notation"
    snippet: "⟨x, y⟩ = 0"
  - context: "Set builder notation"
    snippet: "{ ⟨a, b⟩ | a ∈ A }"

cross_references:
  pairs: []
  sets: []
  widgets: []

added_in: 0.1.0
last_verified: 2026-05-19
