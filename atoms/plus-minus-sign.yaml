# atoms/plus-minus-sign.yaml
# The ± glyph. Diff-patch core marker. Survives all terminals.
glyph: ±
name: PLUS-MINUS SIGN
codepoint: U+00B1
unicode_block: Latin-1 Supplement
unicode_version: "1.1"

aliases:
  - plus-minus
  - approximate
  - margin-of-error
  - tolerance
  - diff-modified

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: variable

tier: 0

semantic:
  primary: math:plus-minus
  also:
    - diff:modified
    - uncertainty:tolerance
    - annotation:approximate-range
  not:
    - decoration
    - diff:added (use +)
    - diff:removed (use -)

pairs_with:
  complement: null
  next_in_set:
    - + (PLUS SIGN)
    - "- (MINUS SIGN)"
  family:
    - + - ± ~

visual_neighbors:
  - "+ (PLUS) — add"
  - "- (MINUS) — remove"
  - "∓ — math complement"

prefer_over:
  - "~ in diff-patch for 'modified' — ± is more precise for file changes"
  - "+ in scientific notation for error margins"

prefer_under:
  - "~ in diff-patch when the change type is ambiguous"

anti_uses:
  - "As a bullet — reads as 'uncertain', not 'item'"
  - "Next to ✓ — confuses: ± means 'plus or minus', ✓ means 'confirmed'"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - diff-patch
  - scientific-technical

examples:
  - context: "Diff summary"
    snippet: "± 7 lines modified"
  - context: "Measurement tolerance"
    snippet: "42.0 ± 0.5 mm"
  - context: "Scientific notation"
    snippet: "mean = 3.14 ± 0.01"

cross_references:
  pairs: []
  sets: []
  widgets:
    - "widgets.md#diff-header"

added_in: 0.1.0
last_verified: 2026-05-19
