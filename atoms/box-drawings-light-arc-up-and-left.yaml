# atoms/box-drawings-light-arc-up-and-left.yaml
# Bottom-right rounded corner. Used in maximalist-decorative frames.
glyph: ╯
name: BOX DRAWINGS LIGHT ARC UP AND LEFT
codepoint: U+256F
unicode_block: Box Drawing
unicode_version: "1.1"

aliases:
  - rounded bottom-right
  - arc corner BR
  - smooth corner bottom-right

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W2
width_class: narrow

tier: 2

semantic:
  primary: frame:corner-rounded-br
  also:
    - border:decorative-bottom-end
    - structure:soft-frame
  not:
    - structure:grid-cell

pairs_with:
  complement: ╭ (BOX DRAWINGS LIGHT ARC DOWN AND RIGHT)
  next_in_set:
    - ╭ ╮ ╰ ╯
  family:
    - ╭ ╮ ╰ ╯

visual_neighbors:
  - ┘ (sharp bottom-right corner) — W1
  - ⌋ (RIGHT FLOOR) — math bracket

prefer_over:
  - "┘ in decorative UIs"

prefer_under:
  - "┘ in terminal-hacker vibe"

anti_uses:
  - "Mixed with sharp corners in same frame"
  - "Outside monospace font"
  - "In terminal-hacker vibe"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: false

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - maximalist-decorative

examples:
  - context: "Decorative rounded frame"
    snippet: "╰──────────╯"

examples:
  - context: "Decorative rounded frame"
    snippet: "╭──────────╮
│  message  │
╰──────────╯"
  - context: "Achievement badge border"
    snippet: "╭──────╮
│  OK  │
╰──────╯"

cross_references:
  pairs:
    - "pairs.md#box-corners"
  sets:
    - "sets.md#box-drawing-lines"
  widgets: []

