# atoms/middle-dot.yaml
# The clean separator. Quieter than a comma, lighter than a dash, kit-native
# across both vibes that love whitespace and vibes that love density.
glyph: ·
name: MIDDLE DOT
codepoint: U+00B7
unicode_block: Latin-1 Supplement
unicode_version: "1.1"

aliases:
  - middot
  - interpunct
  - separator dot
  - centered dot
  - flat dot
  - the breath

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: narrow

tier: 0

semantic:
  primary: separator:inline
  also:
    - separator:metadata
    - separator:list-soft
    - operator:multiplication-typographic
    - mark:catalan-l-geminat
  not:
    - bullet
    - decimal point
    - status indicator

pairs_with:
  complement: null
  next_in_set:
    - • (BULLET)
    - ‧ (HYPHENATION POINT)
  family:
    - • ‧ ⋅ ∙ ⸱

visual_neighbors:
  - • (BULLET) — heavier, body-prose bullet
  - ∙ (BULLET OPERATOR) — math, slightly heavier
  - ⋅ (DOT OPERATOR) — math multiplication, baseline
  - ‧ (HYPHENATION POINT) — for hyphenation only
  - . (FULL STOP) — punctuation, lower position
  - · (vs · MIDDLE DOT) — most fonts render identically

prefer_over:
  - "• for metadata separators — • is body-prose bullet, · is inline"
  - "| (PIPE) in user-facing UI — · is softer, less terminal-flavoured"
  - ", (COMMA) in pure-metadata lines — · scans faster than punctuation"
  - "— (EM DASH) for short pauses — — is structural, · is breath"

prefer_under:
  - "• when actually using as a list bullet at the start of a line"
  - "— when separating clauses, not items"
  - "| in pure CLI / monospace ASCII contexts where · risks tofu in legacy fonts"

anti_uses:
  - "As decimal point — use . (FULL STOP) for numbers"
  - "As multiplication in plain text math — use × or ⋅ (DOT OPERATOR)"
  - "Adjacent to ‧ — visually identical, semantically confused"
  - "Doubled (· ·) as ellipsis — use ⋯ or … instead"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - terminal-hacker
  - modern-minimal
  - maximalist-decorative
  - rtl-arabic-elegant
  - scientific-technical
  - game-ui
  - status-operational
  - diff-patch

examples:
  - context: "Footer metadata"
    snippet: "● live · 47ms · 99.9% · v2.4"
  - context: "Author byline"
    snippet: "Kariem · 2026-05-19 · 4 min read"
  - context: "Tag list"
    snippet: "rust · async · networking · embedded"
  - context: "Sub-header"
    snippet: "Status · Last 24 hours"

cross_references:
  pairs:
    - "pairs.md#dot-separators"
  sets:
    - "sets.md#inline-separators"
  widgets:
    - "widgets.md#status-line"
    - "widgets.md#footer"

added_in: 0.1.0
last_verified: 2026-05-19
