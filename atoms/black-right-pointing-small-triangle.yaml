# atoms/black-right-pointing-small-triangle.yaml
# Right-pointing bullet. Used in diff-patch and tree-like contexts.
glyph: ▸
name: BLACK RIGHT-POINTING SMALL TRIANGLE
codepoint: U+25B8
unicode_block: Geometric Shapes
unicode_version: "1.1"

aliases:
  - right bullet
  - play triangle
  - expand arrow
  - disclosure triangle

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W2
width_class: variable

tier: 2

semantic:
  primary: ui:expand-right
  also:
    - list:bullet-right
    - navigation:next-item
    - tree:expand
  not:
    - direction:right (use →)
    - play:media (use ▶)

pairs_with:
  complement: ▹ (WHITE RIGHT-POINTING SMALL TRIANGLE)
  next_in_set:
    - ▸ ▹
  family:
    - ▸ ▹ ▶ ▷

visual_neighbors:
  - ▶ (BLACK RIGHT-POINTING TRIANGLE) — larger
  - ▷ (WHITE RIGHT-POINTING TRIANGLE) — empty
  - → (right arrow) — longer stroke

prefer_over:
  - "→ in list contexts where you want compact direction markers"

prefer_under:
  - "→ in navigation contexts — ▸ is a bullet, not a flow indicator"

anti_uses:
  - "As a play button — use ▶"
  - "As a flow arrow — use →"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - diff-patch

examples:
  - context: "Change list in diff summary"
    snippet: "▸ added: 12 lines\n▸ modified: 7 lines"
  - context: "Folder expand"
    snippet: "▸ src/"

cross_references:
  pairs: []
  sets: []
  widgets: []

added_in: 0.1.0
last_verified: 2026-05-19
