# atoms/dark-shade.yaml
glyph: ▓
name: DARK SHADE
codepoint: U+2593
unicode_block: Block Elements
unicode_version: "1.1"

aliases:
  - dark shade
  - 75% shade
  - heavy fill
  - dot-matrix dense
  - near-full block

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W3
width_class: variable
tier: 1

semantic:
  primary: shade:dark
  also:
    - intensity:75
    - texture:dot-matrix-dense
    - bar:heavy-segment
  not:
    - full block (use █)
    - decoration

pairs_with:
  complement: ░ (LIGHT SHADE)
  next_in_set:
    - ░ (LIGHT SHADE)
    - ▒ (MEDIUM SHADE)
    - █ (FULL BLOCK)
  family:
    - "░ ▒ ▓ █"

visual_neighbors:
  - "█ (FULL BLOCK) — solid, no texture"
  - "▒ (MEDIUM SHADE) — lighter"
  - "▰ (BLACK PARALLELOGRAM) — discrete pill, not block"

prefer_over:
  - "█ when wanting texture to read distinctly from solid"
  - "▰ in dense terminal aesthetics (htop-style)"
  - "▒ when stronger contrast is needed"

prefer_under:
  - "█ when solid signal is intended"
  - "▰ in modern-minimal pill bars"

anti_uses:
  - "Mixed with W1/W2 dots in same bar — weight clash"
  - "In small font sizes — texture indistinguishable from █"
  - "Above 80% bar fill — readers can't distinguish ▓ from █"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - terminal-hacker
  - status-operational

examples:
  - context: "Terminal progress (htop style)"
    snippet: "▓▓▓▓▒▒░░  CPU 60%"
  - context: "Heatmap row, high intensity"
    snippet: "▓▓▓▓▓  jul"
  - context: "Severity bar"
    snippet: "▓▓▓▒░  alert"
  - context: "Ramp gradient"
    snippet: "░ ▒ ▓ █"

cross_references:
  pairs:
    - "pairs.md#shade-ramp"
  sets:
    - "sets.md#shade-blocks"
  widgets:
    - "widgets.md#terminal-progress"
    - "widgets.md#heatmap"

added_in: 0.1.0
last_verified: 2026-05-19
