# atoms/box-drawings-light-vertical.yaml
# The vertical rule unit. Tiles to make columns and box sides. The yin to ─.
glyph: │
name: BOX DRAWINGS LIGHT VERTICAL
codepoint: U+2502
unicode_block: Box Drawing
unicode_version: "1.1"

aliases:
  - light vertical
  - vertical bar
  - column rule
  - the spine
  - thin vertical
  - "pipe (typographic)"

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: 2ch

tier: 1

semantic:
  primary: line:vertical-tile
  also:
    - rule:vertical
    - border:left
    - border:right
    - tree:trunk
  not:
    - "ASCII pipe |"
    - through symbol

pairs_with:
  complement: ─ (BOX DRAWINGS LIGHT HORIZONTAL)
  next_in_set:
    - ┃ (BOX DRAWINGS HEAVY VERTICAL)
    - ║ (BOX DRAWINGS DOUBLE VERTICAL)
  family:
    - "─ ━ │ ┃ ┌ ┐ └ ┘ ├ ┤ ┬ ┴ ┼"

visual_neighbors:
  - "┃ (BOX DRAWINGS HEAVY VERTICAL) — W3 sibling"
  - "║ (BOX DRAWINGS DOUBLE VERTICAL) — doubled stroke"
  - "| (ASCII PIPE) — narrower, no font tiling guarantee"
  - "❘ (LIGHT VERTICAL BAR) — punctuation-class"
  - "ǀ (LATIN LETTER DENTAL CLICK) — phonetic"

prefer_over:
  - "| (ASCII PIPE) when drawing columns — | gap-prone across fonts"
  - "‖ when separating columns — ‖ is doubled, heavier"
  - "│ over ┃ when matching W1/W2 surrounding atoms"

prefer_under:
  - "┃ in headers or selected rows where heavier weight signals emphasis"
  - "‖ when an actual doubled line is desired (rare)"

anti_uses:
  - "In proportional fonts — won't align with horizontal counterparts"
  - "As ASCII pipe in inline data — use | for shell/code, │ for visual columns"
  - "Adjacent to ┃ at junctions — junction glyph chooses one weight"
  - "Standalone as a separator — use · or | per vibe; │ reads as column"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - terminal-hacker
  - modern-minimal
  - scientific-technical
  - status-operational
  - diff-patch

examples:
  - context: "Card side"
    snippet: "│ status  ● │"
  - context: "Tree continuation"
    snippet: "├─ api\n│  ├─ v1\n│  └─ v2\n└─ db"
  - context: "Column rule between rows"
    snippet: "name      │  state\nhvar-cron │  ◐ idle"
  - context: "Multi-pane sidebar"
    snippet: "files │ search │ git"

cross_references:
  pairs:
    - "pairs.md#horizontal-vertical-pair"
  sets:
    - "sets.md#box-drawing-light"
  widgets:
    - "widgets.md#card-frame"
    - "widgets.md#tree-view"
    - "widgets.md#column-table"

added_in: 0.1.0
last_verified: 2026-05-19
