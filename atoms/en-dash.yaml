# atoms/en-dash.yaml
glyph: –
name: EN DASH
codepoint: U+2013
unicode_block: General Punctuation
unicode_version: "1.1"

aliases:
  - endash
  - range dash
  - half-em dash
  - the range mark

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: variable
tier: 1

semantic:
  primary: range:numeric
  also:
    - range:date
    - range:page
    - separator:bicontact
    - separator:soft-thought-break
  not:
    - hyphen
    - minus
    - em dash

pairs_with:
  complement: null
  next_in_set:
    - "- (HYPHEN-MINUS)"
    - "— (EM DASH)"
  family:
    - "- – — ―"

visual_neighbors:
  - "— (EM DASH) — twice as wide"
  - "- (HYPHEN-MINUS) — narrower"
  - "‒ (FIGURE DASH) — for figures, same width in most fonts"
  - "− (MINUS SIGN) — math, baseline-symmetric"

prefer_over:
  - "— in ranges (2024–2026) — — is too heavy for ranges"
  - "- in spans (pages 12–18) — - reads as hyphenation"
  - "−  in date ranges"

prefer_under:
  - "— for thought-break / parenthetical"
  - "- in compound words (well-known) and ASCII-only contexts"
  - "− for negative numbers and math"

anti_uses:
  - "As minus sign — use − (U+2212)"
  - "As hyphen in compound words — use -"
  - "Inside <code> — distracts; pick - in code"
  - "As section break — use — instead"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - terminal-hacker
  - modern-minimal
  - maximalist-decorative
  - rtl-arabic-elegant
  - scientific-technical
  - game-ui
  - status-operational
  - diff-patch

examples:
  - context: "Date range"
    snippet: "2024–2026"
  - context: "Page range"
    snippet: "pp. 12–18"
  - context: "Bidirectional contact"
    snippet: "Cairo–Berlin route"
  - context: "Soft thought break in compact prose"
    snippet: "live – 47ms – 99.9%"

cross_references:
  pairs:
    - "pairs.md#dash-family"
  sets:
    - "sets.md#dash-weights"
  widgets:
    - "widgets.md#date-range"

added_in: 0.1.0
last_verified: 2026-05-19
