# atoms/rightwards-arrow.yaml
# Flow / next / consequence. The single most-used arrow. CRITICAL: this glyph
# mirrors in RTL contexts — agents emitting Arabic UI must use ← or set
# explicit dir="ltr" on inline LTR flow markers.
glyph: →
name: RIGHTWARDS ARROW
codepoint: U+2192
unicode_block: Arrows
unicode_version: "1.1"

aliases:
  - arrow
  - right arrow
  - next
  - then
  - leads to
  - implies
  - flow

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: variable

tier: 0

semantic:
  primary: flow:next
  also:
    - relation:implies
    - sequence:then
    - direction:rightwards-in-LTR
    - mapping:source-to-target
  not:
    - decoration
    - "‘→ this way’ navigation arrow in RTL UI (mirrors!)"

pairs_with:
  complement: ← (LEFTWARDS ARROW)
  next_in_set:
    - ↑ (UPWARDS ARROW)
    - ↓ (DOWNWARDS ARROW)
    - ↔ (LEFT RIGHT ARROW)
  family:
    - → ← ↑ ↓ ↔ ↕ ↖ ↗ ↘ ↙

visual_neighbors:
  - ⇒ (RIGHTWARDS DOUBLE ARROW) — implies/maps-to in math
  - ➔ (HEAVY WIDE-HEADED RIGHTWARDS ARROW) — W3
  - ▶ (BLACK RIGHT-POINTING TRIANGLE) — play/forward
  - › (SINGLE RIGHT-POINTING ANGLE QUOTATION MARK) — much smaller
  - ➜ (HEAVY ROUND-TIPPED RIGHTWARDS ARROW) — decorative
  - ↦ (RIGHTWARDS ARROW FROM BAR) — function mapping

prefer_over:
  - "➔ when matching W1/W2 weights — ➔ is heavier"
  - "▶ for flow direction — ▶ reads as play/transport"
  - "› in step sequences — › is punctuation-weight, → reads as flow"
  - "ASCII three-char ->  — → is one glyph, copy-paste durable"

prefer_under:
  - "➔ in calls-to-action where bolder arrow aids click affordance"
  - "⇒ in mathematical contexts where double-stroke means implication"

anti_uses:
  - "In RTL Arabic body text without explicit dir — visually flips, reverses meaning"
  - "As play/forward control — use ▶"
  - "As bullet/separator — use · or →·· combined consciously, not as default"
  - "In monospace columns where you want vertical alignment — width varies"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: true
  arabic_equivalent: ← (LEFTWARDS ARROW)
  safe_in_rtl: false

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - terminal-hacker
  - modern-minimal
  - scientific-technical
  - game-ui
  - status-operational
  - diff-patch

examples:
  - context: "Flow line"
    snippet: "fetch → parse → render"
  - context: "Rename diff"
    snippet: "user.go → account.go"
  - context: "Migration arrow"
    snippet: "v1 → v2 · 47 rows migrated"
  - context: "Function mapping"
    snippet: "uid → email · 12 cached"

cross_references:
  pairs:
    - "pairs.md#cardinal-arrows"
  sets:
    - "sets.md#arrow-cardinals"
  widgets:
    - "widgets.md#flow-line"
    - "widgets.md#diff-header"

added_in: 0.1.0
last_verified: 2026-05-19
