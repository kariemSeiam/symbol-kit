# atoms/full-block.yaml
glyph: █
name: FULL BLOCK
codepoint: U+2588
unicode_block: Block Elements
unicode_version: "1.1"

aliases:
  - full block
  - solid block
  - filled cell
  - block char
  - cursor block

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W4
width_class: variable
tier: 1

semantic:
  primary: block:solid
  also:
    - bar:filled-solid
    - cursor:block
    - intensity:max
    - rectangle:filled-cell
  not:
    - shade (use ▓)
    - decoration

pairs_with:
  complement: " " (SPACE)
  next_in_set:
    - ▓ (DARK SHADE)
    - ▒ (MEDIUM SHADE)
    - ░ (LIGHT SHADE)
  family:
    - "░ ▒ ▓ █"

visual_neighbors:
  - "▓ (DARK SHADE) — textured almost-full"
  - "▰ (BLACK PARALLELOGRAM) — slanted pill"
  - "■ (BLACK SQUARE) — square aspect, smaller"
  - "▮ (BLACK VERTICAL RECTANGLE) — narrow, tall"
  - "⬛ (BLACK LARGE SQUARE) — emoji surface"

prefer_over:
  - "▓ when full solid signal is intended"
  - "■ for full-cell coverage (■ has padding)"
  - "▰ in terminal aesthetics (htop, ranger)"

prefer_under:
  - "▰ in modern-minimal pill bars"
  - "▓ when texture aids reading at low contrast"

anti_uses:
  - "Mixed with W1/W2 atoms in same element — weight class clash (AP-01)"
  - "Adjacent to ░ at boundaries — readers see horizontal banding"
  - "Stacked vertically without breathing — visually merges"
  - "In small font sizes inside Telegram body — may render as ▓"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - terminal-hacker
  - status-operational

examples:
  - context: "Solid terminal bar"
    snippet: "████████░░  80%"
  - context: "Heatmap maximum"
    snippet: "████  dec  ████"
  - context: "ASCII-art emphasis title"
    snippet: "███  symbol-kit  ███"
  - context: "Cursor block"
    snippet: "kariem@host:~$ █"

cross_references:
  pairs:
    - "pairs.md#block-space"
  sets:
    - "sets.md#shade-blocks"
  widgets:
    - "widgets.md#terminal-progress"
    - "widgets.md#cursor"

added_in: 0.1.0
last_verified: 2026-05-19
