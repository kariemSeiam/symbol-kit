# atoms/left-ceiling.yaml
# Mathematical ceiling bracket. Opening.
glyph: ⌈
name: LEFT CEILING
codepoint: U+2308
unicode_block: Miscellaneous Technical
unicode_version: "1.1"

aliases:
  - ceiling open
  - ceil bracket
  - round-up bracket

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: narrow

tier: 2

semantic:
  primary: math:ceiling-open
  also:
    - function:round-up
    - bracket:technical
  not:
    - decoration
    - frame:corner

pairs_with:
  complement: ⌉ (RIGHT CEILING)
  next_in_set:
    - ⌈ ⌉ ⌊ ⌋
  family:
    - ⌈ ⌉ ⌊ ⌋

visual_neighbors:
  - "┌ (box-drawing corner) — frame, not math"
  - "⌜ (TOP LEFT CORNER) — smaller apostrophe-like variant"
  - "[ (LEFT SQUARE BRACKET)"

prefer_over:
  - "- ⌜ for ceiling — ⌈ is the canonical form"

prefer_under:
  - "- [ in ASCII-only contexts"

anti_uses:
  - "As a box-drawing corner — use ┌"
  - "In body prose"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - scientific-technical

examples:
  - context: "Ceiling function"
    snippet: "⌈x⌉ = 4"
  - context: "Round-up notation"
    snippet: "⌈3.14⌉"

cross_references:
  pairs: []
  sets: []
  widgets: []

added_in: 0.1.0
last_verified: 2026-05-19
