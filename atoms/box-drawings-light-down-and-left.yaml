# atoms/box-drawings-light-down-and-left.yaml
# Top-right corner of a light box.
glyph: ┐
name: BOX DRAWINGS LIGHT DOWN AND LEFT
codepoint: U+2510
unicode_block: Box Drawing
unicode_version: "1.1"

aliases:
  - top-right corner
  - corner down-left
  - box NE
  - frame end-top
  - the upper-right

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: 2ch

tier: 1

semantic:
  primary: corner:top-right
  also:
    - frame:end-top
  not:
    - bracket

pairs_with:
  complement: └ (BOX DRAWINGS LIGHT UP AND RIGHT)
  next_in_set:
    - ┌ (BOX DRAWINGS LIGHT DOWN AND RIGHT)
    - └ (BOX DRAWINGS LIGHT UP AND RIGHT)
    - ┘ (BOX DRAWINGS LIGHT UP AND LEFT)
  family:
    - "┌ ┐ └ ┘ ┏ ┓ ┗ ┛ ╔ ╗ ╚ ╝"

visual_neighbors:
  - "┓ (BOX DRAWINGS HEAVY DOWN AND LEFT) — W3"
  - "╗ (BOX DRAWINGS DOUBLE DOWN AND LEFT) — doubled"
  - "╮ (BOX DRAWINGS LIGHT ARC DOWN AND LEFT) — rounded"
  - "⌝ (TOP RIGHT CORNER) — punctuation-class"

prefer_over:
  - "┓ when surrounding atoms are W1/W2"
  - "╗ for boxes in plain status UIs"
  - "+ ASCII corner"

prefer_under:
  - "╮ in maximalist-decorative for rounded warmth"
  - "┓ for header/emphasis bands"

anti_uses:
  - "Mixed with ╭ or ┏ in same box — junction weight clash"
  - "As prose bracket — use ⌝ or 」"
  - "In proportional fonts"
  - "Standalone — implies structure not present"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: true
  arabic_equivalent: ┌ (BOX DRAWINGS LIGHT DOWN AND RIGHT)
  safe_in_rtl: false

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - terminal-hacker
  - scientific-technical
  - status-operational

examples:
  - context: "Card top-right"
    snippet: "┌──────────┐\n│  ● live  │\n└──────────┘"
  - context: "Boxed warning end"
    snippet: "┌─ ⚠ retry in 12s ─┐"
  - context: "Mini box"
    snippet: "┌────┐\n│ 47 │\n└────┘"
  - context: "Right-justified callout"
    snippet: "        ┌─ note ┐\n        │  v0.1 │\n        └───────┘"

cross_references:
  pairs:
    - "pairs.md#box-corners"
  sets:
    - "sets.md#box-drawing-light"
  widgets:
    - "widgets.md#card-frame"

added_in: 0.1.0
last_verified: 2026-05-19
