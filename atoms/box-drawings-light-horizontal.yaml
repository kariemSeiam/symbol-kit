# atoms/box-drawings-light-horizontal.yaml
# The horizontal rule unit. Tiles cleanly into rules across monospace fonts.
# Pairs with │ for box-corner construction.
glyph: ─
name: BOX DRAWINGS LIGHT HORIZONTAL
codepoint: U+2500
unicode_block: Box Drawing
unicode_version: "1.1"

aliases:
  - light horizontal
  - horizontal rule unit
  - hr cell
  - tiling dash
  - the line atom
  - thin horizontal

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: 2ch

tier: 1

semantic:
  primary: line:horizontal-tile
  also:
    - rule:thin
    - border:top
    - border:bottom
    - line:divider-tileable
  not:
    - em dash
    - hyphen
    - minus

pairs_with:
  complement: │ (BOX DRAWINGS LIGHT VERTICAL)
  next_in_set:
    - ━ (BOX DRAWINGS HEAVY HORIZONTAL)
    - ═ (BOX DRAWINGS DOUBLE HORIZONTAL)
  family:
    - "─ ━ │ ┃ ┌ ┐ └ ┘ ├ ┤ ┬ ┴ ┼"

visual_neighbors:
  - "━ (BOX DRAWINGS HEAVY HORIZONTAL) — W3 sibling"
  - "═ (BOX DRAWINGS DOUBLE HORIZONTAL) — W3 doubled"
  - "— (EM DASH) — text-flow, doesn't tile cleanly"
  - "- (HYPHEN-MINUS) — narrower, leaves gaps when tiled"
  - "─ at narrower fonts may abut next-cell without overlap, leaving hairlines"

prefer_over:
  - "— (EM DASH) when drawing rules — — has gaps in many fonts"
  - "- repeated as hr — copy-paste fragile, gap-prone"
  - "─ (this) over ━ when matching W1/W2 surrounding atoms"

prefer_under:
  - "━ when matching heavy box-drawing for emphasis"
  - "═ for double-stroke decorative borders"

anti_uses:
  - "In proportional fonts — boxes break, use CSS borders instead"
  - "As em dash in prose — use —, ─ is a tiling unit"
  - "Mixed with — in same rule — gap discontinuity"
  - "Tiled at narrow column widths under non-monospace fallback fonts"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - terminal-hacker
  - modern-minimal
  - scientific-technical
  - status-operational
  - diff-patch

examples:
  - context: "Top of card"
    snippet: "┌────────────┐"
  - context: "Section divider"
    snippet: "──────────────"
  - context: "Tree branch"
    snippet: "├─ api\n├─ db\n└─ cache"
  - context: "Inline rule"
    snippet: "● live  ─  47ms  ─  99.9%"

cross_references:
  pairs:
    - "pairs.md#horizontal-vertical-pair"
  sets:
    - "sets.md#box-drawing-light"
  widgets:
    - "widgets.md#card-frame"
    - "widgets.md#tree-view"

added_in: 0.1.0
last_verified: 2026-05-19
