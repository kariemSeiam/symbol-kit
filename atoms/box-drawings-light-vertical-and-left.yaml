# atoms/box-drawings-light-vertical-and-left.yaml
glyph: ┤
name: BOX DRAWINGS LIGHT VERTICAL AND LEFT
codepoint: U+2524
unicode_block: Box Drawing
unicode_version: "1.1"

aliases:
  - right tee
  - vertical-left tee
  - reverse branch
  - rtl tree branch

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: 2ch
tier: 1

semantic:
  primary: junction:vertical-left
  also:
    - tree:branch-rtl
    - frame:right-tee
  not:
    - vertical bar
    - cross

pairs_with:
  complement: ├ (BOX DRAWINGS LIGHT VERTICAL AND RIGHT)
  next_in_set:
    - ┘ (BOX DRAWINGS LIGHT UP AND LEFT)
    - │ (BOX DRAWINGS LIGHT VERTICAL)
  family:
    - "├ ┤ ┬ ┴ ┼ ┣ ┫"

visual_neighbors:
  - "┫ (BOX DRAWINGS HEAVY VERTICAL AND LEFT) — W3"
  - "╣ (BOX DRAWINGS DOUBLE VERTICAL AND LEFT) — doubled"
  - "⊣ (LEFT TACK) — math, smaller"

prefer_over:
  - "+ ASCII junction"
  - "┫ when matching W1/W2 weights"
  - "╣ for non-decorative junctions"

prefer_under:
  - "┫ for emphasis"
  - "Use ├ in LTR trees; ┤ is for RTL trees or table-side junctions"

anti_uses:
  - "In LTR file trees — use ├ which reads as branching forward"
  - "In proportional fonts"
  - "Mixed weight in same junction"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: true
  arabic_equivalent: ├ (BOX DRAWINGS LIGHT VERTICAL AND RIGHT)
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - terminal-hacker
  - rtl-arabic-elegant
  - scientific-technical
  - status-operational

examples:
  - context: "Table row junction (right side)"
    snippet: "├─────┤\n│  ●  │\n├─────┤"
  - context: "RTL tree branch"
    snippet: "api  ─┤\ndb   ─┤\ncache└─"
  - context: "Right-side rule with content"
    snippet: "status ┤\nlive   ┤\n47ms   ┘"
  - context: "Split header"
    snippet: "┌─name─┬─state─┐\n│ api  │  ●    ┤"

cross_references:
  pairs:
    - "pairs.md#tee-junctions"
  sets:
    - "sets.md#box-drawing-light"
  widgets:
    - "widgets.md#table"
    - "widgets.md#tree-view-rtl"

added_in: 0.1.0
last_verified: 2026-05-19
