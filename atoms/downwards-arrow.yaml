# atoms/downwards-arrow.yaml
glyph: ↓
name: DOWNWARDS ARROW
codepoint: U+2193
unicode_block: Arrows
unicode_version: "1.1"

aliases:
  - down arrow
  - south arrow
  - decrease
  - fall
  - downgrade
  - descending

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: variable
tier: 1

semantic:
  primary: trend:down
  also:
    - direction:south
    - delta:negative
    - state:decreased
    - rank:demoted
  not:
    - decoration
    - subscript marker

pairs_with:
  complement: ↑ (UPWARDS ARROW)
  next_in_set:
    - ↑ (UPWARDS ARROW)
    - ← (LEFTWARDS ARROW)
    - → (RIGHTWARDS ARROW)
  family:
    - "← → ↑ ↓ ↔ ↕"

visual_neighbors:
  - "▼ (BLACK DOWN-POINTING TRIANGLE) — solid, heavier"
  - "⇓ (DOWNWARDS DOUBLE ARROW) — math doubled"
  - "↘ (SOUTH EAST ARROW) — diagonal"
  - "⬇ (DOWNWARDS BLACK ARROW) — heavier"

prefer_over:
  - "▼ when matching W1/W2 weights"
  - "⬇ in monochrome surfaces"
  - "↘ when emphasizing pure vertical, not loss over time"

prefer_under:
  - "▼ for emphasis (revenue ▼ 8%)"
  - "↘ when implying a downward trend over a time axis"

anti_uses:
  - "As subscript control"
  - "Mixed with ← → without consistency"
  - "Inline with W3/W4 atoms — weight clash"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - terminal-hacker
  - modern-minimal
  - scientific-technical
  - game-ui
  - status-operational
  - diff-patch

examples:
  - context: "Negative trend"
    snippet: "latency ↓ 12ms"
  - context: "Demoted item"
    snippet: "↓ deprioritised"
  - context: "Cardinal compass"
    snippet: "  ↑ N\n← W   E →\n  ↓ S"
  - context: "Downvote count"
    snippet: "↑ 47   ↓ 3"

cross_references:
  pairs:
    - "pairs.md#cardinal-arrows"
  sets:
    - "sets.md#arrow-cardinals"
    - "sets.md#trend-pair"
  widgets:
    - "widgets.md#trend-line"
    - "widgets.md#voting"

added_in: 0.1.0
last_verified: 2026-05-19
