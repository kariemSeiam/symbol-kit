# atoms/white-right-pointing-small-triangle.yaml
# Hollow right bullet. Pairs with ▸ for filled/empty states.
glyph: ▹
name: WHITE RIGHT-POINTING SMALL TRIANGLE
codepoint: U+25B9
unicode_block: Geometric Shapes
unicode_version: "1.1"

aliases:
  - white right bullet
  - empty play triangle
  - hollow disclosure

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: variable

tier: 2

semantic:
  primary: ui:collapsed-right
  also:
    - list:bullet-right-inactive
    - tree:collapsed
  not:
    - direction:right
    - active-state

pairs_with:
  complement: ▸ (BLACK RIGHT-POINTING SMALL TRIANGLE)
  next_in_set:
    - ▸ ▹
  family:
    - ▸ ▹ ▶ ▷

visual_neighbors:
  - ▷ (WHITE RIGHT-POINTING TRIANGLE) — larger, heavier
  - ▸ (black variant) — filled
  - → (right arrow)

prefer_over:
  - "▸ for inactive/collapsed items in a tree"

prefer_under:
  - "▸ for active/expanded items"

anti_uses:
  - "As a directional arrow — use →"
  - "Alone without ▸ paired — the filled/empty relationship is the point"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - diff-patch

examples:
  - context: "Tree with expand/collapse"
    snippet: "▸ src/\n▹ lib/"
  - context: "Inactive diff items"
    snippet: "▹ no changes  ·  ▸ modified"

cross_references:
  pairs: []
  sets: []
  widgets: []

added_in: 0.1.0
last_verified: 2026-05-19
