# atoms/box-drawings-light-up-and-right.yaml
glyph: └
name: BOX DRAWINGS LIGHT UP AND RIGHT
codepoint: U+2514
unicode_block: Box Drawing
unicode_version: "1.1"

aliases:
  - bottom-left corner
  - corner up-right
  - box SW
  - tree-last-branch
  - frame end-bottom-left

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: 2ch
tier: 1

semantic:
  primary: corner:bottom-left
  also:
    - tree:last-branch
    - frame:end-bottom
  not:
    - bracket

pairs_with:
  complement: ┐ (BOX DRAWINGS LIGHT DOWN AND LEFT)
  next_in_set:
    - ┘ (BOX DRAWINGS LIGHT UP AND LEFT)
    - ┌ (BOX DRAWINGS LIGHT DOWN AND RIGHT)
  family:
    - "┌ ┐ └ ┘ ┏ ┓ ┗ ┛"

visual_neighbors:
  - "┗ (BOX DRAWINGS HEAVY UP AND RIGHT) — W3"
  - "╚ (BOX DRAWINGS DOUBLE UP AND RIGHT) — doubled"
  - "╰ (BOX DRAWINGS LIGHT ARC UP AND RIGHT) — rounded"
  - "L (LATIN LETTER L)"

prefer_over:
  - "┗ when matching W1/W2 weights"
  - "╚ for non-decorative boxes"
  - "+ ASCII corner"

prefer_under:
  - "╰ in maximalist-decorative for rounded warmth"
  - "┗ for emphasis"

anti_uses:
  - "Mixed weights inside one box"
  - "As bracket in prose"
  - "In proportional fonts"
  - "Standalone without ─ continuation"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: true
  arabic_equivalent: ┘ (BOX DRAWINGS LIGHT UP AND LEFT)
  safe_in_rtl: false

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - terminal-hacker
  - scientific-technical
  - status-operational

examples:
  - context: "Card bottom-left"
    snippet: "┌──────────┐\n│  ● live  │\n└──────────┘"
  - context: "Tree last child"
    snippet: "├─ api\n├─ db\n└─ cache"
  - context: "Prompt second line"
    snippet: "┌─[host]\n└─$ "
  - context: "Boxed footer"
    snippet: "└─ v0.1.0 · 2026-05-19 ─"

cross_references:
  pairs:
    - "pairs.md#box-corners"
  sets:
    - "sets.md#box-drawing-light"
  widgets:
    - "widgets.md#card-frame"
    - "widgets.md#tree-view"

added_in: 0.1.0
last_verified: 2026-05-19
