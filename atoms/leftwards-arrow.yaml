# atoms/leftwards-arrow.yaml
# The LTR back arrow / the RTL forward arrow. Mirror partner of →.
glyph: ←
name: LEFTWARDS ARROW
codepoint: U+2190
unicode_block: Arrows
unicode_version: "1.1"

aliases:
  - left arrow
  - back arrow
  - previous
  - return-to
  - assignment-arrow
  - rtl flow forward

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: variable
tier: 1

semantic:
  primary: flow:previous-LTR
  also:
    - flow:next-RTL
    - relation:reverse-implies
    - direction:leftwards
    - assignment:gets-value
  not:
    - decoration
    - subtraction
    - undo (use ↶)

pairs_with:
  complement: → (RIGHTWARDS ARROW)
  next_in_set:
    - → (RIGHTWARDS ARROW)
    - ↑ (UPWARDS ARROW)
    - ↓ (DOWNWARDS ARROW)
  family:
    - "← → ↑ ↓ ↔ ↕"

visual_neighbors:
  - "⇐ (LEFTWARDS DOUBLE ARROW) — math reverse-implies"
  - "◀ (BLACK LEFT-POINTING TRIANGLE) — play-back/transport"
  - "‹ (SINGLE LEFT-POINTING ANGLE QUOTATION MARK) — quotation"
  - "↩ (LEFTWARDS ARROW WITH HOOK) — return/enter"
  - "↶ (ANTICLOCKWISE TOP SEMICIRCLE ARROW) — undo"

prefer_over:
  - "◀ for flow direction — ◀ reads as play-back/rewind"
  - "↶ for back-navigation — ↶ reads as undo"
  - "‹ in step sequences — ‹ is punctuation"
  - "←  over ascii <- — single glyph, no fragmentation"

prefer_under:
  - "↩ for ‘return’ in chat/form contexts"
  - "⇐ in mathematical contexts where double-stroke implies reverse implication"

anti_uses:
  - "In LTR breadcrumb forward-flow — use → for forward, ← only for back"
  - "As subtraction or minus sign — use −"
  - "Mixed with ↑↓ on same row when only horizontal flow intended"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: true
  arabic_equivalent: → (RIGHTWARDS ARROW)
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - terminal-hacker
  - modern-minimal
  - rtl-arabic-elegant
  - scientific-technical
  - game-ui
  - status-operational
  - diff-patch

examples:
  - context: "Reverse-flow / unwind"
    snippet: "render ← parse ← fetch"
  - context: "Rollback diff"
    snippet: "account.go ← user.go"
  - context: "RTL Arabic forward flow"
    snippet: "‫● مباشر · 47 مل‌ث ← التالي‬"
  - context: "Back navigation"
    snippet: "← back to inbox"

cross_references:
  pairs:
    - "pairs.md#cardinal-arrows"
  sets:
    - "sets.md#arrow-cardinals"
  widgets:
    - "widgets.md#flow-line"
    - "widgets.md#breadcrumbs"

added_in: 0.1.0
last_verified: 2026-05-19
