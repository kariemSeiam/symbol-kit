# atoms/partial-differential.yaml
# Mathematical operator. Scientific-technical core.
glyph: ∂
name: PARTIAL DIFFERENTIAL
codepoint: U+2202
unicode_block: Mathematical Operators
unicode_version: "1.1"

aliases:
  - partial derivative
  - curly d
  - del

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: variable

tier: 2

semantic:
  primary: math:partial-derivative
  also:
    - calculus:differential, operator:partial, notation:boundary
  not:
    - decoration
    - emoji

pairs_with:
  complement: null
  next_in_set: []
  family: []

visual_neighbors:
  - Similar symbols vary — check context

prefer_over:
  - "ASCII equivalent in code — ∂ is the correct math notation"

prefer_under:
  - "ASCII equivalent in plain-text where Unicode is unavailable"

anti_uses:
  - "As decoration in non-scientific contexts"
  - "In body prose without mathematical justification"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

