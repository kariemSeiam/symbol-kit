# atoms/box-drawings-light-up-and-horizontal.yaml
# The bottom T-junction. Used for table footers in terminal frames.
glyph: ┴
name: BOX DRAWINGS LIGHT UP AND HORIZONTAL
codepoint: U+2534
unicode_block: Box Drawing
unicode_version: "1.1"

aliases:
  - bottom T-junction
  - footer divider
  - table foot
  - up-tee

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: narrow

tier: 1

semantic:
  primary: frame:joint-up
  also:
    - structure:table-footer
    - border:bottom-splitter
  not:
    - decoration

pairs_with:
  complement: ┬ (BOX DRAWINGS LIGHT DOWN AND HORIZONTAL)
  next_in_set:
    - ─ (BOX DRAWINGS LIGHT HORIZONTAL)
    - │ (BOX DRAWINGS LIGHT VERTICAL)
  family:
    - ┌ ┐ └ ┘ ├ ┤ ┬ ┴ ┼ ─ │

visual_neighbors:
  - ┬ (top T-junction)
  - ┼ (cross junction)
  - ⊥ (UP TACK) — math symbol, different weight

prefer_over:
  - "ASCII inverted T when the rest of the frame is box-drawing"

prefer_under:
  - "Nothing — this is the only bottom T-junction at W1 weight"

anti_uses:
  - "Outside monospace font"
  - "In proportionally-spaced Telegram body text"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: false

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - terminal-hacker

examples:
  - context: "Table footer in terminal frame"
    snippet: "├──────┴──────┤\n│ total   42   │"
  - context: "HUD footer split"
    snippet: "├──────┴──────┤"

cross_references:
  pairs:
    - "pairs.md#box-corners"
  sets:
    - "sets.md#box-drawing-lines"
  widgets:
    - "widgets.md#health-board"

added_in: 0.1.0
last_verified: 2026-05-19
