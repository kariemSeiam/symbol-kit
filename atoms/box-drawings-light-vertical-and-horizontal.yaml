# atoms/box-drawings-light-vertical-and-horizontal.yaml
# The cross junction. Used for table cells in terminal frames.
glyph: ┼
name: BOX DRAWINGS LIGHT VERTICAL AND HORIZONTAL
codepoint: U+253C
unicode_block: Box Drawing
unicode_version: "1.1"

aliases:
  - cross junction
  - intersection
  - table cell corner
  - plus-box

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W1
width_class: narrow

tier: 2

semantic:
  primary: frame:joint-cross
  also:
    - structure:table-cell
    - border:internal-corner
  not:
    - decoration

pairs_with:
  complement: null
  next_in_set:
    - ─ (BOX DRAWINGS LIGHT HORIZONTAL)
    - │ (BOX DRAWINGS LIGHT VERTICAL)
  family:
    - ┌ ┐ └ ┘ ├ ┤ ┬ ┴ ┼ ─ │

visual_neighbors:
  - + (ASCII plus) — similar shape, W2 weight, harder corners
  - ╋ (BOX DRAWINGS HEAVY VERTICAL AND HORIZONTAL) — W3
  - ⊕ (CIRCLED PLUS) — math symbol

prefer_over:
  - "+ in terminal frame — ┼ aligns precisely with other box-drawing"

prefer_under:
  - "ASCII + when the rest of the frame is ASCII-art"

anti_uses:
  - "Outside monospace font"
  - "As math operator — use ⊕ or + instead"
  - "In proportionally-spaced body text"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: null
  safe_in_rtl: false

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - terminal-hacker

examples:
  - context: "Table cell junction"
    snippet: "┌──┬──┐\n│a │b │\n├──┼──┤\n│c │d │\n└──┴──┘"
  - context: "Grid intersection"
    snippet: "──┼──"

cross_references:
  pairs:
    - "pairs.md#box-corners"
  sets:
    - "sets.md#box-drawing-lines"
  widgets:
    - "widgets.md#health-board"

added_in: 0.1.0
last_verified: 2026-05-19
