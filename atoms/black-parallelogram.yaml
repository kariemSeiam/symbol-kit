# atoms/black-parallelogram.yaml
# Filled progress cell. The "▰" half of the PROGRESS() bar pair. Official
# Unicode name is PARALLELOGRAM, but every common monospace font renders
# this as a substantial filled rounded-rectangle cell — kit's canonical
# filled-pill atom.
glyph: ▰
name: BLACK PARALLELOGRAM
codepoint: U+25B0
unicode_block: Geometric Shapes
unicode_version: "3.2"

aliases:
  - filled pill
  - filled progress cell
  - filled rounded square
  - filled tile
  - progress filled
  - bar filled

form:
  default: text
  variation_selectors:
    none: text
  emoji_form_exists: false

weight_class: W3
width_class: variable

tier: 0

semantic:
  primary: progress:filled-cell
  also:
    - tile:filled
    - bar:filled-segment
    - intensity:high-step
    - pill:on
  not:
    - geometric parallelogram in math
    - decoration

pairs_with:
  complement: ▱ (WHITE PARALLELOGRAM)
  next_in_set:
    - ▱ (WHITE PARALLELOGRAM)
  family:
    - ▰ ▱ ■ □ ▮ ▯ ▪ ▫

visual_neighbors:
  - ■ (BLACK SQUARE) — sharper edges, square aspect
  - ▮ (BLACK VERTICAL RECTANGLE) — taller than wide
  - █ (FULL BLOCK) — fills entire cell, no breathing room
  - ▓ (DARK SHADE) — textured, not solid
  - ⬛ (BLACK LARGE SQUARE) — emoji surface

prefer_over:
  - "■ for progress segments — ▰ has slight slant that signals ‘bar tile’"
  - "█ for progress segments — █ tiles into a solid line, ▰ tiles into discrete pills"
  - "▓ when meaning ‘complete’ — ▓ implies texture/partial fill"

prefer_under:
  - "█ + ░ in dense terminal contexts (htop, ranger) where solid blocks read better"
  - "■ when paired with □ in scientific/typographic contexts"

anti_uses:
  - "Mixed with █ (FULL BLOCK) in same bar — weight clash, █ has no air"
  - "As lone glyph for ‘active’ — use ● instead, ▰ is bar context"
  - "Tiled into rules — use ─ or ━, ▰ is for discrete cells"
  - "In Arabic-context UI without verifying — some fonts render slanted opposite-handed"

platforms:
  telegram_ios:      { renders: unverified }
  telegram_android:  { renders: unverified }
  telegram_desktop:  { renders: unverified }
  telegram_web:      { renders: unverified }
  imessage:          { renders: unverified }
  whatsapp:          { renders: unverified }
  discord:           { renders: unverified }
  slack:             { renders: unverified }
  github_markdown:   { renders: unverified }
  vscode_default:    { renders: unverified }
  terminal_monaco:   { renders: unverified }
  terminal_cascadia: { renders: unverified }
  terminal_jetbrains_mono: { renders: unverified }
  chrome:            { renders: unverified }
  safari:            { renders: unverified }
  firefox:           { renders: unverified }
  print_pdf:         { renders: unverified }

rtl_behavior:
  mirrors: false
  arabic_equivalent: ■ (BLACK SQUARE)
  safe_in_rtl: true

copy_paste_safe: true
monochrome_guaranteed: true

vibes:
  - terminal-hacker
  - modern-minimal
  - status-operational

examples:
  - context: "Progress 60%"
    snippet: "▰▰▰▰▰▰▱▱▱▱  60%"
  - context: "Inline progress in footer"
    snippet: "● live · ▰▰▰▰▱▱  40% sync"
  - context: "Three jobs"
    snippet: "▰▰▰▰▰▰▰▰▰▱  geo\n▰▰▰▰▰▱▱▱▱▱  hvar\n▱▱▱▱▱▱▱▱▱▱  taxi"
  - context: "Confidence interval"
    snippet: "confidence ▰▰▰▰▰▰▰▰▱▱  80%"

cross_references:
  pairs:
    - "pairs.md#filled-empty-pills"
  sets:
    - "sets.md#progress-cells"
  widgets:
    - "widgets.md#progress-bar"
    - "widgets.md#multi-bar-card"

added_in: 0.1.0
last_verified: 2026-05-19
