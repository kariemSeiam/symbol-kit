- expr: 'STATUS_DOT("live")'
  expected: "●"

- expr: 'STATUS_DOT("idle")'
  expected: "◐"

- expr: 'STATUS_DOT("offline")'
  expected: "○"

- expr: "PROGRESS(0.6)"
  expected: "▰▰▰▰▰▰▱▱▱▱"

- expr: "PROGRESS(0.23, 20)"
  expected: "▰▰▰▰▰▱▱▱▱▱▱▱▱▱▱▱▱▱▱▱"

- expr: "SEVERITY(2)"
  expected: "●●○○"

- expr: "SEVERITY(3, 5)"
  expected: "●●●○○"

- expr: "BAR(12, 20, 10)"
  expected: "▓▓▓▓▓▓░░░░"

- expr: 'KASHIDA_FILL("جيولينك", 15)'
  expected: "جيولينكــــــــ"

- expr: "RATING(3)"
  expected: "●●●○○"

- expr: "RETRY_NOTICE(30)"
  expected: "↻ 30s"

- expr: "@black-circle"
  expected: "●"

- expr: "@black-circle × 3"
  expected: "●●●"

- expr: '@black-circle + " " + @white-circle'
  expected: "● ○"

- expr: 'STATUS_DOT("live") + " · " + PROGRESS(0.6)'
  expected: "● · ▰▰▰▰▰▰▱▱▱▱"
